# Q08 — continuous integration for every push and pull request on main: lint, typecheck, the unit gate, the dependency audit, the build and
# (RA-10) a secret scan of the pushed tree.
# It never deploys (production releases are made with scripts/release-production.sh, which requires this workflow to have succeeded).
# Installed on 01/11/2026 (the owner's GitHub token received the « workflow » scope).
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: "Strict TypeScript (no regression; the baseline is 0 since R40)"
        run: npm run typecheck:strict:baseline
      - name: "Strict lint (no regression per rule or in total vs docs/reports/eslint-strict-baseline.json; R43)"
        run: npm run lint:strict:baseline
      - name: Unit gate (only the declared known failures may fail)
        run: node scripts/unit-gate.mjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: "Legal publisher configuration and draft documents (R45: no domicile without approval, no draft in Production)"
        run: node scripts/check-legal-publisher.mjs
      - name: Build (public beta)
        run: npx vite build
        env:
          VITE_PUBLIC_BETA: 'true'
          VITE_LEGAL_DATA_PROTECTION_CONTACT: contact@accesdirectaide.fr
  secret-scan:
    # RA-10: the repository is public. The scan used to run only on the developer's machine (optional pre-push hook) and in the release script, AFTER the
    # push. Same scan as `npm run security:secrets` (scripts/security-secrets-scan.mjs): gitleaks over the tracked files, with the repository's
    # .gitleaks.toml and .gitleaksignore, findings redacted. The binary is pinned by version AND sha256; the actions are pinned by commit. No token needed.
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan the tracked files (redacted output; a finding fails the workflow)
        run: npm run security:secrets
