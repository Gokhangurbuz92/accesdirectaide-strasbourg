# Q08 — continuous integration for every push and pull request on main: lint, typecheck, the unit gate, the dependency audit, the build,
# (RA-10) a secret scan of the pushed tree and (G14-CHAN) the automated accessibility job.
# It never deploys (production releases are made with scripts/release-production.sh, which requires this workflow to have succeeded).
# Installed on 01/11/2026 (the owner's GitHub token received the « workflow » scope).
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: "Strict TypeScript (no regression; the baseline is 0 since R40)"
        run: npm run typecheck:strict:baseline
      - name: "Strict lint (no regression per rule or in total vs docs/reports/eslint-strict-baseline.json; R43)"
        run: npm run lint:strict:baseline
      - name: Unit gate (only the declared known failures may fail)
        run: node scripts/unit-gate.mjs
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: "Legal publisher configuration and draft documents (R45: no domicile without approval, no draft in Production)"
        run: node scripts/check-legal-publisher.mjs
      - name: Build (public beta)
        run: npx vite build
        env:
          VITE_PUBLIC_BETA: 'true'
          VITE_LEGAL_DATA_PROTECTION_CONTACT: contact@accesdirectaide.fr
  a11y:
    # G14-CHAN (Part B) — automated accessibility in CI, 0 €: no secret, no database, no Production. The app is built (mock mode) and served by
    # `vite preview` on 127.0.0.1; the browser mocks every API call (e2e/fixtures.js). Runs beside « quality » (parallel), so the release gate
    # (scripts/release-production.sh waits for this workflow) is not slowed while this job stays shorter than « quality ».
    # Automated checks only: they catch regressions; they are not an RGAA audit and replace no test with real users (none has been made).
    name: Accessibility (axe WCAG 2.2 AA + best practices, keyboard, reflow / 400 %, text spacing, RTL, forced colours, contrast states, screen-reader patterns)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache the Playwright browsers (keyed on the lockfile, i.e. the Playwright version)
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system libraries (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: "Screen-reader patterns (virtual screen reader), lang / dir, FALC readability heuristic (unit)"
        run: npx vitest run tests/unit/g14-a11y-virtual-screen-reader.test.jsx tests/unit/g14-a11y-lang-dir.test.jsx tests/unit/g14-falc-readability.test.js
      - name: "FALC readability (Kandel-Moles — a heuristic, WARN only, never fails)"
        run: node scripts/falc-readability.mjs
      - name: Build (mock mode)
        run: npx vite build
      - name: "Playwright: e2e/accessibility.spec.js, tests/a11y, e2e-a11y (every finding fails)"
        run: npx playwright test -c playwright.a11y-ci.config.mjs
      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-test-results
          path: test-results/a11y-ci
          retention-days: 7
  secret-scan:
    # RA-10: the repository is public. The scan used to run only on the developer's machine (optional pre-push hook) and in the release script, AFTER the
    # push. Same scan as `npm run security:secrets` (scripts/security-secrets-scan.mjs): gitleaks over the tracked files, with the repository's
    # .gitleaks.toml and .gitleaksignore, findings redacted. The binary is pinned by version AND sha256; the actions are pinned by commit. No token needed.
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan the tracked files (redacted output; a finding fails the workflow)
        run: npm run security:secrets
